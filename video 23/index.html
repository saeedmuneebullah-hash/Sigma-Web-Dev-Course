<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding: 45px;
            margin: 34px;
        }
    </style>
</head>
<body>
    <div class="box">
        Dream big. Build smart. Grow your business.
    </div>
    <div class="box">Learn today, build tomorrow, succeed for a lifetime</div>
    <span>succeed for a lifetime.</span>
    <span>Code it. Build it. Own it</span>
</body>
</html>
