<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
          /* Element selector */
          div {
            /* background-color:pink; */
          }
          /* class selector */
          .red {
            background-color: rgb(190, 25, 53);
          }

          /* Id selector */
         #green {
            background-color: green;
         }

         /* Child Selector */
        div > p{
            color:blue;
            background-color: yellow;
        }     

        /* Descendant Selector */
        div p {
            color:blue;
            background-color: yellow;
        }     

        /* Universal selector */
        * {
            margin:0;
            padding: 0; 
        }

        /* pseudo selector */
        a:visited{
            color: rgb(0, 26, 255);
        }

        a:link {
                 color:green;
        }

        a:active {
            background-color: rgb(223, 11, 46);
        }

        a:hover {
            background-color: orange
        }

        p:first-child{
            background-color:rgb(212, 181, 4);
        }
    </style>
</head>
<body>
    <main class="one"> 
         <p>I am first</p>
         <p>I am second</p>
    </main>
    <div class="red">
        I am a div
        <article>
        <p>I am a para inside div</p>
        </article>
    </div>

    <div id="green">
        I am another div
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook2.com">Go to Facebook</a>
</body>
</html>
