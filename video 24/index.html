<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 15px 5px #d40b98;
        }
        .text-element{
            text-shadow: 2px 2px 4px #181be2;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Cupiditate tempora non perspiciatis provident numquam, molestias aperiam quidem expedita iure sit vel inventore, rem incidunt voluptas error omnis eaque ab commodi, atque ea possimus laboriosam?
    </p>
</body>

</html>
