<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background-color: #FF69B4;
            width: 100%;
            height: 60px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Green Container */
        .green-container {
            background-color: #228B22;
            border: 4px solid #000000;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            border-radius: 8px;
        }

        /* Square Boxes */
        .square-box {
            width: 150px;
            height: 150px;
            border-radius: 4px;
        }

        .pink-box {
            background-color: #FFB3BA;
        }

        .blue-box {
            background-color: #4169E1;
        }

        /* Card Container */
        .card {
            position: relative;
            background-color: #1a1a1a;
            border: 2px solid #808080;
            border-radius: 40px;
            padding: 50px 80px;
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
        }

        .card-text {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Orange Dot */
        .orange-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            background-color: #FF8C00;
            border-radius: 50%;
        }

        /* Footer */
        .footer {
            background-color: #FFFFFF;
            width: 100%;
            height: 60px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Green Container with Boxes -->
        <div class="green-container">
            <div class="square-box pink-box"></div>
            <div class="square-box blue-box"></div>
        </div>

        <!-- Card with Text and Orange Dot -->
        <div class="card">
            <div class="orange-dot"></div>
            <p class="card-text">Welcome to this Sigma Web<br>Development Express</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer"></div>
</body>
</html>
